<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ifrah Farooq | Full Stack Developer</title>
    <script>
      // GitHub Pages SPA redirect
      // Encodes the path into a query string so index.html can restore it
      var pathSegmentsToKeep = 1; // number of path segments in the base (e.g. /ifrah-farooq-98/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
