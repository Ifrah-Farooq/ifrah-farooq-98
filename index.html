  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect — restore path from query string
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Restore path encoded by 404.html
        var l = window.location;
        if (l.search[1] === 'p' && l.search.indexOf('p=/') === 1) {
          var decoded = l.search.slice(1).split('&').reduce(function(p, s) {
            var r = s.split('=');
            p[r[0]] = r.slice(1).join('=').replace(/~and~/g, '&');
            return p;
          }, {});
          if (decoded.p !== undefined) {
            history.replaceState(
              null, null,
              l.pathname.slice(0, -1) + (decoded.p || '') +
              (decoded.q ? '?' + decoded.q : '') + l.hash
            );
          }
        }
      })();
    </script>
